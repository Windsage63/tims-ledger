{% extends "base.html" %}

{% block content %}
            <section class="flex min-h-0 w-full flex-1 items-start justify-center" aria-labelledby="welcome-title">
                <div class="flex h-[90%] min-h-0 w-full flex-col items-center justify-start gap-6 py-2 text-center">
                    <img class="mx-auto min-h-0" style="flex: 0 1 auto; width: clamp(384px, 60%, 1536px); max-width: 100%; height: auto; object-fit: contain;" src="/frontend/assets/splash-ledger.png?v=20261004" width="1536" height="1024" alt="" decoding="async">
                    <div class="w-full shrink-0">
                        <h2 class="font-display text-4xl font-bold tracking-tight text-ink lg:text-5xl" id="welcome-title">Tim's Ledger</h2>
                        <p class="mt-4 text-lg text-muted">Project billing, simply organized.</p>
                        <p class="mx-auto mt-6 max-w-md text-sm leading-6 text-muted">Use the sidebar to record your work, manage invoices, and receive payments.</p>
                    </div>
                </div>
            </section>
{% endblock %}
